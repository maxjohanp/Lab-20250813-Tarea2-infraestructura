  <text x="40" y="52" font-size="27" font-weight="800" fill="#0B1F3A">Flujo AAA · inicio de sesión en consola con un usuario de Active Directory</text>
  <text x="40" y="80" font-size="15" fill="#475569">Ejemplo: soporte0813 (miembro de GRP-NIVEL-5) entra por la consola de R-0813 · Maxyohan Montas (2025-0813)</text>

  <text x="800.0" y="812" text-anchor="middle" font-size="14" font-weight="700" fill="#0E7C86">Accounting Start / Stop · UDP 1813</text>
  <text x="800.0" y="846" text-anchor="middle" font-size="12.5" fill="#475569">aaa accounting exec AAA-RADIUS start-stop</text>
  <text x="800.0" y="864" text-anchor="middle" font-size="12.5" fill="#475569">NPS lo guarda en LogFiles\IN*.log</text>

  <rect x="40" y="920" width="740" height="112" rx="14" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="62" y="950" font-size="15" font-weight="800" fill="#B91C1C">Si la clave es incorrecta o el usuario no está en un grupo de nivel</text>
  <text x="62" y="975" font-size="13.5" fill="#334155">NPS responde Access-Reject (evento 6273, motivo 16 o 65) y el equipo muestra</text>
  <text x="62" y="996" font-size="13.5" fill="#334155">«% Authentication failed». El intento queda en el log del equipo.</text>
  <text x="62" y="1017" font-size="13.5" fill="#334155">El usuario local NO entra mientras el NPS responda: el rechazo es definitivo.</text>
  <rect x="820" y="920" width="740" height="112" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="842" y="950" font-size="15" font-weight="800" fill="#B45309">Si el NPS no responde (apagado o sin red)</text>
  <text x="842" y="975" font-size="13.5" fill="#334155">Tras el tiempo de espera (5 s y 2 reintentos) IOS pasa al siguiente método</text>
  <text x="842" y="996" font-size="13.5" fill="#334155">de la lista: «local». Entra admin0813 con nivel 15. Por eso la lista es</text>
  <text x="842" y="1017" font-size="13.5" fill="#334155">«group GRP-NPS local»: RADIUS primero, usuario local solo de respaldo.</text>
